services:
  - type: web
    name: aegis-btc-usd
    runtime: python
    plan: free
    buildCommand: python -m unittest discover -s tests -v && python -m py_compile server.py ict_engine.py
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONUNBUFFERED
        value: "1"
